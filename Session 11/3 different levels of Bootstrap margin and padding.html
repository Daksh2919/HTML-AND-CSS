<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <h2 class="text-center mt-4 mb-4">
        Flipkart Product Cards
    </h2>

    <!-- Level 1: Small Margin and Padding -->
    <div class="m-1 p-1 bg-white border rounded">
        <div class="card">
            <img src="mobile.jpg"
                 class="card-img-top"
                 alt="Smartphone">

            <div class="card-body">
                <h5 class="card-title">Smartphone</h5>
            </div>
        </div>
    </div>


    <!-- Level 2: Medium Margin and Padding -->
    <div class="m-3 p-3 bg-white border rounded">
        <div class="card">
            <img src="laptop.jpg"
                 class="card-img-top"
                 alt="Laptop">

            <div class="card-body">
                <h5 class="card-title">Laptop</h5>
            </div>
        </div>
    </div>


    <!-- Level 3: Large Margin and Padding -->
    <div class="m-5 p-5 bg-white border rounded">
        <div class="card">
            <img src="headphone.jpg"
                 class="card-img-top"
                 alt="Headphones">

            <div class="card-body">
                <h5 class="card-title">Wireless Headphones</h5>
            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
