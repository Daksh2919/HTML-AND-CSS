<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <!-- Movie Title -->
            <h2 class="fw-bold fs-2 mb-2">
                Avengers: Endgame
            </h2>

            <!-- Movie Details -->
            <p class="text-muted fs-6 mb-3">
                Action • Adventure • 3h 2m
            </p>

            <!-- Rating -->
            <div class="mb-3">
                <span class="fw-bold fs-4 text-danger">
                    ★ 4.8/5
                </span>
                <span class="fw-semibold fs-6 text-muted">
                    (25K+ Ratings)
                </span>
            </div>

            <hr>

            <!-- Review -->
            <h5 class="fw-semibold fs-5">
                User Review
            </h5>

            <p class="fs-6 fw-normal text-secondary">
                An amazing movie with great action, emotional moments,
                and an exciting story. The performances and visual effects
                make it a memorable experience.
            </p>

            <!-- Reviewer -->
            <p class="fw-bold fs-6 mb-0">
                Rahul Patel
            </p>

            <small class="text-muted">
                Reviewed 2 days ago
            </small>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
