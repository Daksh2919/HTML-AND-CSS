<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<!-- Main Container -->
<div id="mainContainer"
     class="container-fluid min-vh-100 bg-light text-dark p-5">

    <div class="text-center">

        <h1 class="mb-3">
            Movie Booking
        </h1>

        <p class="fs-5">
            Welcome to our movie booking page!
        </p>

        <!-- Theme Switcher Button -->
        <button id="themeButton" class="btn btn-dark">
            🌙 Dark Mode
        </button>

        <div class="card mt-5 mx-auto shadow" style="max-width: 400px;">
            <div class="card-body">
                <h3>Avengers: Endgame</h3>
                <p>Action | Adventure | 3h 2m</p>

                <button class="btn btn-primary">
                    Book Ticket
                </button>
            </div>
        </div>

    </div>

</div>


<!-- JavaScript -->
<script>
    const mainContainer = document.getElementById("mainContainer");
    const themeButton = document.getElementById("themeButton");

    themeButton.addEventListener("click", function () {

        // Toggle background classes
        mainContainer.classList.toggle("bg-light");
        mainContainer.classList.toggle("bg-dark");

        // Toggle text color classes
        mainContainer.classList.toggle("text-dark");
        mainContainer.classList.toggle("text-light");

        // Change button text
        if (mainContainer.classList.contains("bg-dark")) {
            themeButton.textContent = "☀️ Light Mode";
            themeButton.classList.remove("btn-dark");
            themeButton.classList.add("btn-light");
        } else {
            themeButton.textContent = "🌙 Dark Mode";
            themeButton.classList.remove("btn-light");
            themeButton.classList.add("btn-dark");
        }
    });
</script>

</body>
</html>
