<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Showcase</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center fw-bold mb-4">
        Featured Products
    </h2>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm">

                <img src="image/smartphone.webp"
                     class="card-img-top"
                     alt="Smartphone">

                <div class="card-body text-center">
                    <h5 class="card-title">
                        Smartphone
                    </h5>

                    <p class="text-success fw-bold">
                        ₹14,999
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>
                </div>

            </div>
        </div>


        <!-- Product 2 -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm">

                <img src="image/laptop.jpg"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">
                    <h5 class="card-title">
                        Laptop
                    </h5>

                    <p class="text-success fw-bold">
                        ₹49,999
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>
                </div>

            </div>
        </div>


        <!-- Product 3 -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm">

                <img src="image/headphone.jpg"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">
                    <h5 class="card-title">
                        Wireless Headphones
                    </h5>

                    <p class="text-success fw-bold">
                        ₹2,499
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>
                </div>

            </div>
        </div>


        <!-- Product 4 -->
        <div class="col-6 col-md-3">
            <div class="card h-100 shadow-sm">

                <img src="image/smartwatch.jpg"
                     class="card-img-top"
                     alt="Smartwatch">

                <div class="card-body text-center">
                    <h5 class="card-title">
                        Smartwatch
                    </h5>

                    <p class="text-success fw-bold">
                        ₹3,999
                    </p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>
                </div>

            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
