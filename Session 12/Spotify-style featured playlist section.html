<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Playlists</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center fw-bold mb-4">
        Featured Playlists
    </h2>

    <!-- Bootstrap Grid -->
    <div class="row g-4">

        <!-- Playlist 1 -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">

                <img src="image/chill.jpg"
                     class="card-img-top"
                     alt="Chill Vibes Playlist">

                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">
                        Chill Vibes
                    </h5>

                    <p class="card-text text-muted">
                        Relaxing songs for your peaceful moments.
                    </p>

                    <button class="btn btn-success">
                        ▶ Listen Now
                    </button>
                </div>

            </div>
        </div>


        <!-- Playlist 2 -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">

                <img src="image/gym.jpg"
                     class="card-img-top"
                     alt="Workout Hits Playlist">

                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">
                        Workout Hits
                    </h5>

                    <p class="card-text text-muted">
                        High-energy tracks to power your workout.
                    </p>

                    <button class="btn btn-success">
                        ▶ Listen Now
                    </button>
                </div>

            </div>
        </div>


        <!-- Playlist 3 -->
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">

                <img src="image/hit.jpg"
                     class="card-img-top"
                     alt="Top Hits Playlist">

                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">
                        Top Hits
                    </h5>

                    <p class="card-text text-muted">
                        Listen to the most popular songs right now.
                    </p>

                    <button class="btn btn-success">
                        ▶ Listen Now
                    </button>
                </div>

            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
