<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Artist Landing Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="artist-page">

        <!-- Profile Image -->
        <img src="image/user.png"
             alt="Artist Profile"
             class="artist-image">

        <!-- Artist Name -->
        <h1>Alex Morgan</h1>

        <p class="artist-role">
            Singer • Songwriter • Music Producer
        </p>

        <!-- Bio -->
        <p class="bio">
            Alex Morgan is an independent music artist who creates
            soulful pop and acoustic music. His songs combine
            meaningful lyrics with relaxing melodies.
        </p>

        <!-- Social Media Buttons -->
        <div class="social-buttons">

            <a href="#" class="btn btn-primary">
                <i class="bi bi-instagram"></i>
                Instagram
            </a>

            <a href="#" class="btn btn-danger">
                <i class="bi bi-youtube"></i>
                YouTube
            </a>

            <a href="#" class="btn btn-info text-white">
                <i class="bi bi-twitter-x"></i>
                Twitter
            </a>

        </div>

    </div>

</body>
</html>
