<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Flipkart Products</h2>

    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="https://via.placeholder.com/300x200" 
                     class="card-img-top" alt="Smartphone">

                <div class="card-body">
                    <h5 class="card-title">Samsung Smartphone</h5>
                    <p class="card-text">
                        8GB RAM, 128GB Storage, 50MP Camera
                    </p>
                    <h5>₹19,999</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="https://via.placeholder.com/300x200" 
                     class="card-img-top" alt="Laptop">

                <div class="card-body">
                    <h5 class="card-title">HP Laptop</h5>
                    <p class="card-text">
                        Intel Core i5, 8GB RAM, 512GB SSD
                    </p>
                    <h5>₹49,999</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="https://via.placeholder.com/300x200" 
                     class="card-img-top" alt="Headphones">

                <div class="card-body">
                    <h5 class="card-title">Boat Headphones</h5>
                    <p class="card-text">
                        Wireless Bluetooth Headphones with Deep Bass
                    </p>
                    <h5>₹1,499</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
