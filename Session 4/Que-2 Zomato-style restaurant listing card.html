<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Restaurant Listing</title>
	
	<style>
		body{
			font-family: Arial, sans-serif;
			background-color: #f5f5f5;
			padding: 20px;
		}
		
		.restaurant-card{
			background-color: white;
			width: 350px;
			margin: 20px auto;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 2px 8px #ccc;
		}
		
		.restaurant-card header h2{
			margin: 0;
			color: #e23744;
		}
		
		.restaurant-card p{
			color: #555;
		}
		
		.restaurant-card footer{
			border-top: 1px solid #ddd;
			padding-top: 10px;
			margin-top: 15px;
			display: flex;
			justify-content: space-between;
		}
		
		.rating{
			color: green;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<h1 align="center">Popular Restaurant</h1>
	
	<!-- Restaurant 1 -->
	<article class="restaurant-card">
		<header>
			<h2>Pizza Paradise</h2>
		</header>
		
		<p>Italian, Pizza, Fast Food</p>
		<p>Delicious pizzas and fresh Italian dishes.</p>
		
		<footer>
			<span class="rating">⭐ 4.5</span>
			<span>🛵 30 min</span>
		</footer>
	</article>
	
	<!-- Restaurant 2 -->
	<article class="restaurant-card">
		<header>
			<h2>Spice Garden</h2>
		</header>
		
		<p>North Indian, Gujarati, Chinese</p>
		<p>Authemtic food with a variety of tasty dishes.</p>
		
		<footer>
			<span class="rating">">⭐ 4.3</span>
			<span>🛵 25 min</span>
		</footer>
	</article>
	</article>
</body>
</html>
