<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Style Offer Banner</title>

    <style>
        .offer-banner {
            background-color: #ff3f6c;
            color: white;
            font-family: Arial, sans-serif;

            padding: 25px;
            margin: 30px auto;
            width: 80%;
            border-radius: 10px;

        .offer-banner h1 {
            font-size: 32px;
            margin: 5px;

            margin: 10px;

        <h1>BIG FASHION SALE</h1>

        <p>Shop Now &nbsp; | &nbsp; Limited Time Offer</p>
