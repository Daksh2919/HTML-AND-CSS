<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow - Movie Details</title>

    <style>
        /* Light mode */
        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
            margin: 0;
            transition: 0.3s;
        }

        .movie-card {
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        h1 {
            color: #e51b23;
        }

        .movie-info {
            line-height: 1.8;
        }

        button {
            background-color: #e51b23;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #b9141b;
        }

        /* Dark mode */
        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode .movie-card {
            background-color: #222;
            box-shadow: 0 4px 10px #000;
        }

        body.dark-mode h1 {
            color: #ff4d5a;
        }

        body.dark-mode button {
            background-color: #ff4d5a;
        }
    </style>
</head>

<body>

    <div class="movie-card">
        <h1>Avengers: Endgame</h1>

        <div class="movie-info">
            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>
            <p><strong>Duration:</strong> 3h 2min</p>
            <p><strong>Language:</strong> English</p>
            <p><strong>Rating:</strong> ⭐ 4.8/5</p>
            <p>
                Earth's mightiest heroes come together for one final battle
                to save the universe.
            </p>
        </div>

        <button onclick="toggleDarkMode()">
            Toggle Light/Dark Mode
        </button>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
