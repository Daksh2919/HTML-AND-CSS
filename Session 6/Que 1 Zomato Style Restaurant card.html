<!DOCTYPE html>
<html>
<head>
<title>Task 1 - Zomato Restaurant Card</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color:blue;
    margin: 20px;
}

/* The main card */
.card {
    width: 250px;
    background-color: yellow;
    border: 2px solid ;   /* visible border around the card */
    margin: 10px;                /* space OUTSIDE the card */
    padding: 10px;               /* space INSIDE the card */
}

/* Section 1: restaurant name */
.res-name {
    border: 1px solid gray;      /* border separates this section */
    margin: 10px;
    padding: 10px;
    font-size: 20px;
    font-weight: bold;
    
    
}

/* Section 2: cuisine type */
.res-cuisine {
    border: 1px solid gray;
    margin: 10px;
    padding: 10px;
    color: #555555;
}

/* Section 3: rating */
.res-rating {
    border: 1px solid gray;
    margin: 10px;
    padding: 10px;
    background-color: black;
    color: white;
}

</style>
</head>

<body>

<div class="card">
    <p class="res-name">Spice Garden</p>
    <p class="res-cuisine">North Indian, Chinese</p>
    <p class="res-rating">Rating: 4.5 / 5</p>
</div>

</body>
</html>
