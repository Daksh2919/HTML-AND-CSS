<!DOCTYPE html>
<html>
<head>
<title>Task 3 - WhatsApp Fixed Badge</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 20px;
    min-height: 1500px;          /* makes the page tall so you can scroll */
}

/* The badge */
.chat-badge {
    position: fixed;             /* stays on screen even when scrolling */
    bottom: 0;                   /* stick to the bottom */
    right: 0;                    /* stick to the right */
    margin: 20px;                /* gap from the screen edges */
    padding: 12px 18px;          /* space inside the badge */
    background-color: #25d366;
    color: white;
    font-weight: bold;
    border-radius: 30px;
}

</style>
</head>

<body>

<h2>WhatsApp Fixed Badge</h2>
<p>Scroll the page up and down. The green badge stays at the bottom right corner.</p>

<div class="chat-badge">WhatsApp: 3 new messages</div>

</body>
</html>
