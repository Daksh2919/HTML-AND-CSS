<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Movie Details</h2>

    <div class="row align-items-center">

        <!-- Movie Poster -->
        <div class="col-12 col-md-6 text-center mb-4">
            <img src="https://via.placeholder.com/300x400"
                 class="img-fluid rounded shadow"
                 alt="Movie Poster">
        </div>

        <!-- Movie Details -->
        <div class="col-12 col-md-6 mb-4">
            <h1>Avengers: Endgame</h1>

            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

            <p><strong>Rating:</strong> ⭐ 4.8/5</p>

            <p><strong>Duration:</strong> 3h 2min</p>

            <p>
                An exciting superhero adventure where the Avengers
                unite to save the world.
            </p>

            <button class="btn btn-danger btn-lg">
                Book Now
            </button>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
