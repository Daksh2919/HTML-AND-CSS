<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - BookMyShow</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row align-items-center">

        <!-- Movie Poster -->
        <div class="col-md-4 text-center">
            <img src="https://via.placeholder.com/300x400"
                 class="img-fluid rounded shadow"
                 alt="Movie Poster">
        </div>

        <!-- Movie Details -->
        <div class="col-md-8">
            <h1 class="mb-3">Avengers: Endgame</h1>

            <p><strong>Genre:</strong> Action, Adventure, Science Fiction</p>

            <p><strong>Rating:</strong> ⭐ 4.8/5</p>

            <p>
                <strong>Duration:</strong> 3h 2min
            </p>

            <p>
                Experience an exciting journey with the Avengers
                as they fight to save the world.
            </p>

            <button class="btn btn-danger btn-lg">
                Book Now
            </button>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
